<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"
            integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g="
            crossorigin="anonymous">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Noto Sans KR", sans-serif;
        }

        a {
            text-decoration: none;
            color: black;
        }

        button,
        input {
            border: none;
            outline: none;
        }

        .board-container {
            width: 60%;
            height: 1200px;
            margin: 0 auto;
        }

        .search-container {
            background-color: rgb(253, 253, 250);
            width: 100%;
            height: 110px;
            border: 1px solid #ddd;
            margin-top: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-form {
            height: 37px;
            display: flex;
        }

        .search-option {
            width: 100px;
            height: 100%;
            outline: none;
            margin-right: 5px;
            border: 1px solid #ccc;
            color: gray;
        }

        .search-option > option {
            text-align: center;
        }

        .search-input {
            color: gray;
            background-color: white;
            border: 1px solid #ccc;
            height: 100%;
            width: 300px;
            font-size: 15px;
            padding: 5px 7px;
        }

        .search-input::placeholder {
            color: gray;
        }

        .search-button {
            width: 20%;
            height: 100%;
            background-color: rgb(22, 22, 22);
            color: rgb(209, 209, 209);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
        }

        .search-button:hover {
            color: rgb(165, 165, 165);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            border-top: 2px solid rgb(39, 39, 39);
        }

        tr:nth-child(even) {
            background-color: #f0f0f070;
        }

        th,
        td {
            width: 300px;
            text-align: center;
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }

        td {
            color: rgb(53, 53, 53);
        }

        .no {
            width: 150px;
        }

        .title {
            width: 50%;
        }

        td.title {
            text-align: left;
        }

        td.writer {
            text-align: left;
        }

        td.viewcnt {
            text-align: right;
        }

        td.title:hover {
            text-decoration: underline;
        }

        .paging {
            color: black;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            color: black;
            padding: 6px;
            margin-right: 10px;
        }

        .paging-active {
            background-color: rgb(216, 216, 216);
            border-radius: 5px;
            color: rgb(24, 24, 24);
        }

        .paging-container {
            width: 100%;
            height: 70px;
            display: flex;
            margin-top: 50px;
        }

        .btn-write {
            background-color: rgb(236, 236, 236);
            border: none;
            color: black;
            padding: 6px 12px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 30px;
        }

        .btn-write:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div style="text-align:center">

    <div class="board-container">

        <!-- 검색 -->
        <div class="search-container">

            <form class="search-form"
                  method="get"
                  action="/board/list">

                <select class="search-option"
                        name="type">

                    <option value="title"
                            th:selected="${type == 'title'}">
                        제목
                    </option>

                    <option value="content"
                            th:selected="${type == 'content'}">
                        내용
                    </option>

                    <option value="titleContent"
                            th:selected="${type == 'titleContent'}">
                        제목+내용
                    </option>

                </select>

                <input type="text"
                       class="search-input"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="검색어를 입력해주세요">

                <button type="submit"
                        class="search-button">
                    <i class="fa fa-search"></i>
                </button>

            </form>

        </div>


        <!-- 게시판 목록 -->
        <table>

            <tr>
                <th class="no">번호</th>
                <th class="title">제목</th>
                <th class="writer">이름</th>
                <th class="regdate">등록일</th>
                <th class="viewcnt">조회수</th>
            </tr>

            <tr th:each="board : ${list}">

                <td class="no"
                    th:text="${board.bno}">
                </td>

                <td class="title">
                    <a th:href="@{/board/read(bno=${board.bno})}"
                       th:text="${board.title}">
                    </a>
                </td>

                <td class="writer">
                    <a th:href="@{/board/writer(userId=${board.user.id})}"
                       th:text="${board.user.id}">
                    </a>
                </td>
                <td class="inDate"
                    th:text="${#dates.format(board.inDate, 'yyyy-MM-dd')}">
                </td>

                <td class="viewcnt"
                    th:text="${board.viewCnt}">
                </td>

            </tr>

        </table>


        <!-- 페이징 -->
        <div class="paging-container"
             th:if="${list.totalPages > 0}">

            <div class="paging">

                <!-- 이전 -->
                <a class="page"
                   th:if="${!list.first}"
                   th:href="@{/board/list(
                        page=${list.number - 1},
                        type=${type},
                        keyword=${keyword}
                   )}">
                    이전
                </a>


                <!-- 페이지 번호 -->
                <a class="page"
                   th:each="i : ${#numbers.sequence(0, list.totalPages - 1)}"
                   th:href="@{/board/list(
                        page=${i},
                        type=${type},
                        keyword=${keyword}
                   )}"
                   th:text="${i + 1}"
                   th:classappend="${i == list.number} ? ' paging-active' : ''">
                </a>


                <!-- 다음 -->
                <a class="page"
                   th:if="${!list.last}"
                   th:href="@{/board/list(
                        page=${list.number + 1},
                        type=${type},
                        keyword=${keyword}
                   )}">
                    다음
                </a>

            </div>

        </div>


        <br>


        <!-- 글쓰기 -->
        <button id="writeBtn"
                class="btn-write"
                onclick="location.href='/board/write'">

            <i class="fa fa-pencil"></i>
            글쓰기

        </button>

        <a href="/board/stats" class="btn-write">
            <i class="fa fa-bar-chart"></i>
            통계
        </a>

    </div>

</div>

</body>
</html>
