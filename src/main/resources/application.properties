spring.application.name=ch2

spring.datasource.url=jdbc:mysql://localhost:3306/springboot?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HiberNate로 생성 후 실행하는 sql 쿼리 콘솔에 출력
spring.jpa.show-sql=true

# 출력되는 쿼리를 보기 좋은 형태로 포멧팅
spring.jpa.properties.hibernate.format_sql=true

# 사용할 쿼리 지정
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL 자동 생성
# create : 기존 테이블 삭제 후 다시 생성 (개발용)
# update : 기존 테이블 유지, 변경 사항(컬럼 추가, 삭제, 추가)만 반영 (개발용)
# validate : 검증, none : 아무것도 하지 않음 (운영용)
#spring.jpa.hibernate.ddl-auto=create
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none


